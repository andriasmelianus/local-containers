services:
  mariadb:
    image: docker.io/library/mariadb:lts
    container_name: mariadb
    restart: unless-stopped
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_HOST: ${MARIADB_ROOT_HOST:-%}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-app_db}
      MARIADB_USER: ${MARIADB_USER:-app_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-app_password}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - ./data:/var/lib/mysql:Z
      - ./conf.d:/etc/mysql/conf.d:Z
      - ./initdb.d:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
